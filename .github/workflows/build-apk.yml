name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dipendenze
        run: npm install

      - name: Ricostruisci la pagina del taccuino
        run: python3 build_www.py

      - name: Sincronizza Capacitor
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Permessi gradlew
        run: chmod +x android/gradlew

      - name: Compila APK di debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon 2>&1 | tee ../build.log

      - name: Carica APK come artefatto della run
        uses: actions/upload-artifact@v4
        with:
          name: taccuino-sopralluogo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Rinomina APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk taccuino-sopralluogo.apk

      - name: Pubblica come release "latest" (scaricabile da github.com, non da Azure blob)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest taccuino-sopralluogo.apk \
            --title "Taccuino Sopralluogo — ultima build" \
            --notes "APK di debug compilato automaticamente dal commit ${{ github.sha }}." \
            --target ${{ github.sha }}

      - name: "Pubblica il log di build in caso di errore (stesso motivo: github.com, non Azure blob)"
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete build-log --yes --cleanup-tag || true
          gh release create build-log build.log \
            --title "Taccuino Sopralluogo — log ultima build fallita" \
            --notes "Log di build del commit ${{ github.sha }}." \
            --target ${{ github.sha }}
